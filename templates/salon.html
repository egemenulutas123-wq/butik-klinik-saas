<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <title>Bekleme salonu | {{ klinik_adi }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { fontFamily: { sora: ['Sora', 'system-ui', 'sans-serif'], sans: ['Inter', 'system-ui', 'sans-serif'] } } } };</script>
    <style>
        html, body { height: 100%; background: #05041A; overflow: hidden; }
        .aurora { position: fixed; inset: -20%; z-index: 0; filter: blur(80px); opacity: .55;
            background: radial-gradient(40% 40% at 20% 30%, #3B1D8F, transparent 70%), radial-gradient(35% 35% at 80% 20%, #0E5A6B, transparent 70%),
                        radial-gradient(45% 45% at 60% 85%, #2A1B6E, transparent 70%);
            animation: akis 26s ease-in-out infinite alternate; }
        @keyframes akis { 0% { transform: translate(0, 0) rotate(0deg) scale(1); } 100% { transform: translate(4%, -3%) rotate(8deg) scale(1.08); } }
        .cam { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); -webkit-backdrop-filter: blur(22px); backdrop-filter: blur(22px); }
        .yeni-cagri { animation: parla 1.1s ease-in-out 4; }
        @keyframes parla { 0%, 100% { box-shadow: 0 0 0 0 rgba(94,234,212,0); transform: scale(1); }
                           40% { box-shadow: 0 0 0 18px rgba(94,234,212,0.18), 0 0 120px 20px rgba(94,234,212,0.35); transform: scale(1.015); } }
        .numara-gir { animation: gir .8s cubic-bezier(.2,.9,.2,1.2) both; }
        @keyframes gir { from { opacity: 0; transform: translateY(30px) scale(.9); } to { opacity: 1; transform: none; } }
        .kayan { display: inline-block; padding-left: 100%; animation: kay 28s linear infinite; white-space: nowrap; }
        @keyframes kay { to { transform: translateX(-100%); } }
        .nabiz { animation: nabiz 1.8s ease-in-out infinite; }
        @keyframes nabiz { 50% { opacity: .35; } }
        @media (prefers-reduced-motion: reduce) { .aurora, .kayan, .nabiz, .yeni-cagri, .numara-gir { animation: none !important; } }
    </style>
</head>
<body class="font-sans text-white antialiased">
    <div class="aurora" aria-hidden="true"></div>
    <div class="relative z-10 h-full flex flex-col gap-[2vh] p-[2.2vw]">
        <header class="flex items-center justify-between gap-6">
            <div class="flex items-center gap-[1vw]">
                <span class="w-[3.2vw] h-[3.2vw] min-w-[36px] min-h-[36px] rounded-full" style="background: radial-gradient(circle at 32% 28%, #FFFFFF, #A78BFA 40%, #4C1D95 85%); box-shadow: 0 0 34px rgba(167,139,250,0.7)"></span>
                <div>
                    <div class="font-sora text-[clamp(18px,2.2vw,44px)] font-semibold leading-tight">{{ klinik_adi }}</div>
                    <div class="text-[clamp(12px,1.1vw,22px)] text-violet-200/80">Bekleme salonu</div>
                </div>
            </div>
            <div class="text-right">
                <div id="saat" class="font-sora text-[clamp(28px,4vw,84px)] font-medium leading-none tabular-nums">--:--</div>
                <div id="tarih" class="mt-1 text-[clamp(12px,1.1vw,22px)] text-violet-200/80"></div>
            </div>
        </header>

        <main class="flex-1 min-h-0 grid grid-cols-1 lg:grid-cols-[1.55fr_1fr] gap-[2vw]">
            <section id="anaKart" class="cam rounded-[2.4vw] p-[2.6vw] flex flex-col justify-between min-h-0 overflow-hidden" aria-live="assertive">
                <div class="flex items-center gap-3 text-[clamp(14px,1.4vw,28px)] font-semibold uppercase tracking-[0.18em] text-teal-200">
                    <span class="nabiz w-[1vw] h-[1vw] min-w-[10px] min-h-[10px] rounded-full bg-teal-300"></span>Şimdi çağrılan
                </div>
                <div id="anaIcerik" class="flex-1 flex flex-col justify-center gap-[1.5vh]"></div>
                <div id="oncekiCagrilar" class="flex flex-wrap gap-[0.8vw]"></div>
            </section>

            <section class="cam rounded-[2.4vw] p-[2vw] flex flex-col gap-[1.6vh] min-h-0 overflow-hidden">
                <div class="flex items-baseline justify-between gap-3">
                    <h2 class="font-sora text-[clamp(18px,2vw,40px)] font-medium">Sıradakiler</h2>
                    <span id="bekleyenSayi" class="text-[clamp(12px,1.1vw,22px)] text-violet-200/80"></span>
                </div>
                <ol id="sira" class="flex-1 min-h-0 flex flex-col gap-[1vh] overflow-hidden"></ol>
            </section>
        </main>

        <footer class="cam rounded-full h-[clamp(40px,5vh,72px)] flex items-center overflow-hidden">
            <div class="flex-1 overflow-hidden text-[clamp(14px,1.4vw,28px)] text-violet-50/90"><span id="mesaj" class="kayan"></span></div>
        </footer>
    </div>

    <!-- Ses için bir kez dokunma gerekir (tarayıcı kuralı) -->
    <button id="baslat" type="button" class="fixed inset-0 z-50 flex flex-col items-center justify-center gap-5 text-center" style="background: rgba(5,4,26,0.86); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px)">
        <span class="w-24 h-24 rounded-full flex items-center justify-center text-[#042F2E]" style="background: linear-gradient(135deg, #CCFBF1, #5EEAD4); box-shadow: 0 0 80px rgba(94,234,212,0.5)">
            <svg aria-hidden="true" width="40" height="40" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span>
        <span class="font-sora text-3xl font-medium">Salon ekranını başlat</span>
        <span class="max-w-md text-base text-violet-200">Sesli çağrı için ekrana bir kez dokunun. Ekran tam ekrana geçer ve kendini otomatik günceller.</span>
    </button>

<script>
(function () {
    'use strict';
    var ANAHTAR = {{ anahtar | tojson }};
    var GUNLER = ['Pazar', 'Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi'];
    var AYLAR = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];
    function $(id) { return document.getElementById(id); }
    function el(t, c, m) { var e = document.createElement(t); if (c) e.className = c; if (m !== undefined && m !== null) e.textContent = m; return e; }

    var goruldu = null, sesAcik = false, ses = null, sonMesaj = null, hataSayac = 0;

    function saatGuncelle() {
        var d = new Date();
        $('saat').textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
        $('tarih').textContent = d.getDate() + ' ' + AYLAR[d.getMonth()] + ' ' + GUNLER[d.getDay()];
    }

    function zil() {
        if (!ses) return;
        var t = ses.currentTime;
        [[784, 0], [1047, 0.22], [1319, 0.44]].forEach(function (n) {
            var o = ses.createOscillator(), g = ses.createGain();
            o.type = 'sine'; o.frequency.value = n[0];
            g.gain.setValueAtTime(0, t + n[1]);
            g.gain.linearRampToValueAtTime(0.25, t + n[1] + 0.02);
            g.gain.exponentialRampToValueAtTime(0.001, t + n[1] + 0.9);
            o.connect(g); g.connect(ses.destination);
            o.start(t + n[1]); o.stop(t + n[1] + 1);
        });
    }

    function seslendir(c) {
        if (!sesAcik || !('speechSynthesis' in window)) return;
        var metin = 'Sıra numarası ' + c.sira_no + '. ' + (c.ad ? c.ad.replace(/\.$/, '') + '. ' : '') +
            (c.hekim ? c.hekim.replace(/^Dr\. /, 'Doktor ') + '. ' : '') + (c.oda ? c.oda + '. ' : '') + 'Lütfen.';
        var u = new SpeechSynthesisUtterance(metin);
        u.lang = 'tr-TR'; u.rate = 0.92;
        var tr = speechSynthesis.getVoices().find(function (v) { return /^tr/i.test(v.lang); });
        if (tr) u.voice = tr;
        speechSynthesis.cancel();
        setTimeout(function () { speechSynthesis.speak(u); setTimeout(function () { speechSynthesis.speak(new SpeechSynthesisUtterance(metin)); }, 100); }, 1300);
    }

    function anaCiz(c, yeni) {
        var kap = $('anaIcerik');
        kap.innerHTML = '';
        if (!c) {
            kap.appendChild(el('div', 'font-sora text-[clamp(28px,4vw,80px)] font-medium text-white/80', 'Hoş geldiniz'));
            kap.appendChild(el('div', 'text-[clamp(16px,1.8vw,36px)] text-violet-200/80', 'Adınız veya sıra numaranız çağrıldığında burada görünecek.'));
            return;
        }
        var ust = el('div', 'flex items-end gap-[2.4vw] flex-wrap numara-gir');
        var no = el('div', 'font-sora font-semibold leading-[0.85] tabular-nums', String(c.sira_no));
        no.style.fontSize = 'clamp(110px, 16vw, 340px)';
        no.style.background = 'linear-gradient(180deg, #FFFFFF, ' + c.renk + ')';
        no.style.webkitBackgroundClip = 'text'; no.style.backgroundClip = 'text'; no.style.color = 'transparent';
        ust.appendChild(no);
        var bilgi = el('div', 'pb-[1.6vw] min-w-0');
        if (c.ad) bilgi.appendChild(el('div', 'font-sora text-[clamp(32px,4.6vw,96px)] font-medium leading-tight', c.ad));
        var hd = el('div', 'mt-[0.6vw] flex flex-wrap items-center gap-[0.8vw]');
        if (c.hekim) {
            var hk = el('span', 'inline-flex items-center gap-[0.6vw] h-[clamp(36px,3.6vw,72px)] px-[1.2vw] rounded-full text-[clamp(16px,1.8vw,36px)] font-semibold text-[#0B0720]', c.hekim);
            hk.style.background = c.renk;
            hd.appendChild(hk);
        }
        if (c.oda) hd.appendChild(el('span', 'inline-flex items-center gap-2 h-[clamp(36px,3.6vw,72px)] px-[1.2vw] rounded-full text-[clamp(16px,1.8vw,36px)] font-semibold bg-white text-[#0B0720]', '→ ' + c.oda));
        bilgi.appendChild(hd);
        ust.appendChild(bilgi);
        kap.appendChild(ust);
        var ana = $('anaKart');
        ana.classList.remove('yeni-cagri');
        if (yeni) { void ana.offsetWidth; ana.classList.add('yeni-cagri'); }
    }

    function siraCiz(liste, toplam) {
        var kap = $('sira');
        kap.innerHTML = '';
        $('bekleyenSayi').textContent = toplam ? toplam + ' kişi bekliyor' : '';
        if (!liste.length) { kap.appendChild(el('li', 'text-[clamp(14px,1.4vw,28px)] text-violet-200/70', 'Şu anda bekleyen yok.')); return; }
        liste.forEach(function (b, i) {
            var li = el('li', 'flex items-center gap-[1vw] px-[1.2vw] py-[1.2vh] rounded-[1.4vw] ' + (i === 0 ? 'bg-white/[0.12]' : 'bg-white/[0.05]'));
            var n = el('span', 'w-[clamp(44px,4.4vw,88px)] h-[clamp(44px,4.4vw,88px)] shrink-0 rounded-[1vw] flex items-center justify-center font-sora text-[clamp(20px,2.2vw,44px)] font-semibold text-[#0B0720]', String(b.sira_no));
            n.style.background = b.renk;
            li.appendChild(n);
            var m = el('div', 'flex-1 min-w-0');
            m.appendChild(el('div', 'text-[clamp(16px,1.7vw,34px)] font-semibold truncate', b.ad || ('Sıra ' + b.sira_no)));
            m.appendChild(el('div', 'text-[clamp(12px,1.1vw,22px)] text-violet-200/70 truncate', b.hekim));
            li.appendChild(m);
            li.appendChild(el('span', 'shrink-0 text-[clamp(14px,1.4vw,28px)] font-semibold text-teal-100 tabular-nums', b.dk <= 1 ? 'Sırada' : '~' + b.dk + ' dk'));
            kap.appendChild(li);
        });
    }

    async function yenile() {
        try {
            var y = await fetch('/api/salon/' + encodeURIComponent(ANAHTAR) + '/durum', { cache: 'no-store' });
            if (y.status === 404) { $('anaIcerik').textContent = 'Bu ekran bağlantısı geçersiz. Klinik panelinden yeni bağlantıyı açın.'; return; }
            var v = await y.json();
            hataSayac = 0;
            var c = v.cagrilar[0] || null;
            var yeni = c && goruldu !== null && c.anahtar !== goruldu && c.yeni;
            if (!c || c.anahtar !== goruldu) anaCiz(c, yeni);
            if (yeni) { zil(); seslendir(c); }
            goruldu = c ? c.anahtar : '';
            var onceki = $('oncekiCagrilar');
            onceki.innerHTML = '';
            v.cagrilar.slice(1, 5).forEach(function (x) {
                var e = el('span', 'inline-flex items-center gap-2 h-[clamp(32px,3vw,60px)] px-[1vw] rounded-full bg-white/[0.07] text-[clamp(13px,1.2vw,24px)] text-violet-50/90');
                e.appendChild(el('strong', 'font-sora font-semibold text-white', String(x.sira_no)));
                e.appendChild(document.createTextNode((x.ad ? x.ad + ' · ' : '') + (x.oda || x.hekim)));
                onceki.appendChild(e);
            });
            siraCiz(v.bekleyenler, v.bekleyen_sayi);
            if (v.mesaj !== sonMesaj) { $('mesaj').textContent = v.mesaj || ''; sonMesaj = v.mesaj; }
        } catch (x) {
            if (++hataSayac > 3) $('bekleyenSayi').textContent = 'Bağlantı bekleniyor…';
        }
    }

    $('baslat').addEventListener('click', function () {
        try { ses = new (window.AudioContext || window.webkitAudioContext)(); sesAcik = true; } catch (x) { sesAcik = 'speechSynthesis' in window; }
        if ('speechSynthesis' in window) speechSynthesis.getVoices();
        var d = document.documentElement;
        if (d.requestFullscreen) d.requestFullscreen().catch(function () {});
        if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(function () {});
        this.remove();
    });

    saatGuncelle();
    setInterval(saatGuncelle, 5000);
    yenile();
    setInterval(yenile, 3000);
})();
</script>
</body>
</html>
